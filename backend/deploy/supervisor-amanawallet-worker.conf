# Keeps `php artisan queue:work` running continuously so queued jobs
# (wallet funding confirmation, and now every airtime/data/electricity/
# cable/education purchase) actually get processed instead of sitting in
# the `jobs` table forever.
#
# Install on the VPS:
#   1. Edit the two placeholder paths below (/path/to/amanawalletapp/backend
#      and the `user=` line) to match your actual deployment.
#   2. Copy this file to /etc/supervisor/conf.d/amanawallet-worker.conf
#   3. sudo supervisorctl reread
#   4. sudo supervisorctl update
#   5. sudo supervisorctl start amanawallet-worker:*
#
# If supervisor itself isn't installed yet: `sudo apt install supervisor`
# (Ubuntu/Debian, which Hostinger KVM VPS plans typically run).
#
# After every deploy that changes job/queue-related code, restart workers
# so they pick up the new code (old worker processes keep running the code
# that was loaded when they started, otherwise):
#   php artisan queue:restart
# (signals workers to finish their current job then exit; supervisor
# immediately restarts them per autorestart=true below.)

[program:amanawallet-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/amanawalletapp/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
directory=/path/to/amanawalletapp/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/path/to/amanawalletapp/backend/storage/logs/worker.log
stopwaitsecs=3600
