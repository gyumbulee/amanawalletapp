name: amanawalletapp
description: "Amana Wallet - Fintech digital wallet and bill payment platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Splash screen
  flutter_native_splash: ^2.4.3

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.2.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

  # UI helpers
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  pin_code_fields: ^8.0.1
  shimmer: ^3.0.0

  # Media
  image_picker: ^1.1.2

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # External links
  url_launcher: ^6.3.0

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/

# ============================================================
# FLUTTER NATIVE SPLASH
# ============================================================
#
# Generates the native launch/splash screen for Android, iOS,
# and Web.
#
# After changing the image or background color, run:
#
#   dart run flutter_native_splash:create
#
# ============================================================

flutter_native_splash:
  color: "#374151"
  image: assets/branding/splash_logo.png

  android_12:
    color: "#374151"
    image: assets/branding/splash_logo_android12.png