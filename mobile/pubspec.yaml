name: amanawalletapp
description: "Amana Wallet - Fintech digital wallet and bill payment platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.2.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

  # UI helpers
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  pin_code_fields: ^8.0.1
  shimmer: ^3.0.0

  # Media
  image_picker: ^1.1.2

  # External links
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
